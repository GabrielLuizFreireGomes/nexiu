# Cabeçalhos de segurança do zerone.dev.br.
# Instalado em /etc/nginx/snippets/zerone-headers.conf. Fica num arquivo à parte
# porque o nginx descarta os add_header do server quando um location define os
# seus; cada location inclui este arquivo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
