# Site da ZeroOne Developers em https://zerone.dev.br
# Instalado em /etc/nginx/sites-available/zerone (link em sites-enabled).
# O endereço oficial é https://zerone.dev.br (sem www): http e www redirecionam
# para ele com 301, para o Google indexar uma única versão do site.

# http (qualquer host) -> https://zerone.dev.br
server {
    listen 80;
    listen [::]:80;
    server_name zerone.dev.br www.zerone.dev.br;

    # Renovação do certificado (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://zerone.dev.br$request_uri;
    }
}

# https://www -> https://zerone.dev.br
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zerone.dev.br;

    ssl_certificate /etc/letsencrypt/live/zerone.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerone.dev.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/zerone-headers.conf;
    return 301 https://zerone.dev.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zerone.dev.br;

    ssl_certificate /etc/letsencrypt/live/zerone.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerone.dev.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zerone/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    etag on;

    # O nginx.conf só comprime HTML; aqui entram CSS, JS, SVG, XML e afins.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    # HTML, robots e sitemap: sempre revalidados, para um deploy aparecer na hora.
    location / {
        include /etc/nginx/snippets/zerone-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/zerone-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/zerone-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Arquivos do build com hash no nome: nunca mudam, cache de 1 ano.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/zerone-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Imagens e ícones sem hash: 30 dias.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico)$ {
        include /etc/nginx/snippets/zerone-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Nada de arquivos ocultos (.git, .env...).
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }
}
